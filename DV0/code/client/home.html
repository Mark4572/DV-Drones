<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }


        :root {
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --accent-color: #00adb5;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
            color: white;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .content-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        a {
            color: var(--accent-color);
            margin-top: 1rem;
            display: inline-block;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="content-box">
        <h1></h1>
        <p></p>
        <a href="index.html">Theme Editor</a>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const root = document.documentElement;
            

            const c1 = localStorage.getItem('themeColor1');
            const c2 = localStorage.getItem('themeColor2');
            const c3 = localStorage.getItem('themeColor3');

            if (c1 && c2 && c3) {
                root.style.setProperty('--bg-gradient', `linear-gradient(135deg, ${c1}, ${c2}, ${c3})`);
                root.style.setProperty('--accent-color', c2);
            }
        });
    </script>
</body>
</html>
