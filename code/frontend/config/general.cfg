# general config
[general]
# Set the default language for the application
language = "en"
# Enable or disable debug mode
debug_mode = true
# Set the default units for measurements (metric or imperial)
units = "metric"
# Set the default update interval for telemetry data (in seconds)
update_interval = 1
# Set the default maximum altitude for the drone (in meters)
max_altitude = 100
# Set the default maximum speed for the drone (in m/s)
max_speed = 15

[commands]
# Define available commands and their descriptions
help = "Displays available commands."
status = "System Check: All modules operational. Signal 100%."
takeoff = "Launch sequence initiated..."
land = "Landing sequence initiated..."
deviceinfo = "Displays drone information."

[device]
# Set the default drone ID
drone_id = "DRN-001"
dv_version = "DV_Client_0.2beta"

[logging]
# Set the log file path
log_file_path = "/logs/drone.log"
# Set the maximum log file size (in MB)
max_log_file_size = 10
# Set the number of backup log files to keep
backup_log_files = 5

[appearance]
# Set the default color scheme for the dashboard
color_scheme = (0,0,0)
# Set the default refresh rate for the dashboard (in seconds)
refresh_rate = 5



