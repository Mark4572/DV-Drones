<!doctypehtml>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drone Command Center - Development</title>
    <style>
        :root {
            --bg-black: #0a0a0a;
            --cyan-neon: #00f2ff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --border-cyan: rgba(0, 242, 255, 0.3);
        }

        body {
            background-color: var(--bg-black);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--border-cyan);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.05);
        }

        .full-width { grid-column: span 2; }

        h2 {
            color: var(--cyan-neon);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1rem;
            margin-top: 0;
            border-bottom: 1px solid var(--border-cyan);
            padding-bottom: 10px;
        }

        .back-btn {
    border-color: rgba(0, 242, 255, 0.5); /* Etwas blasser als der Haupt-Cyan-Ton */
    margin-right: 15px;
    font-weight: bold;
}
