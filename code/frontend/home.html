<body>

    <div class="taskbar">
        <div class="taskbar-text" id="sys-date">--/--/----</div>
html_content = f'<div class="taskbar-text"><script>{dv_version}</script></div>
        <div class="taskbar-text" id="sys-time">--:--:--</div>
    </div>




    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const bg = document.querySelector('.background');
            const timeEl = document.getElementById('sys-time');
            const dateEl = document.getElementById('sys-date');

            // 1. Mouse Tracking Logic
            document.addEventListener('mousemove', (e) => {
                if (bg) {
                    const x = (e.clientX / window.innerWidth) * 95;
                    const y = (e.clientY / window.innerHeight) * 95;
                    
                    // Updates the CSS variables in real-time
                    bg.style.setProperty('--mouse-x', x + '%');
                    bg.style.setProperty('--mouse-y', y + '%');
                }
            });

            
            function updateSystemTime() {
                const now = new Date();
                
                
                const timeString = now.toLocaleTimeString('en-US', { 
                    hour12: false, 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit' 
                });

                
                const dateString = now.toLocaleDateString('de-DE', { 
                    day: 'numeric', 
                    month: 'numeric', 
                    year: 'numeric' 
                });

                if (timeEl) timeEl.textContent = timeString;
                if (dateEl) dateEl.textContent = dateString;
            }

            // Start the clock
            updateSystemTime();
            setInterval(updateSystemTime, 1000);
        });
    </script>
</body>
</html>
