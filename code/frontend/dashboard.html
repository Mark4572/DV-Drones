<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <style>
        .console-line {
            white-space: pre-wrap;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Drone Control Dashboard</h1>
        <div style="display:flex;align-items:center;gap:12px">
            <div>
                <input id="esp-ip" placeholder="ESP IP (e.g. 192.168.1.50)" style="padding:6px;border-radius:6px;border:1px solid #ccc"> 
                <input id="esp-port" placeholder="WS Port" value="81" style="width:80px;padding:6px;border-radius:6px;border:1px solid #ccc">
                <button id="conn-btn" class="btn">Connect</button>
            </div>
            <button id="theme-toggle">🌙 Dark Mode</button>
        </div>
    </header>
    <main>
        <section class="status">
            <h2>Drone Status</h2>
            <div class="status-cards">
                <div class="card">
                    <h3>Battery</h3>
                    <p id="stat-battery">{battery}</p>
                </div>
                <div class="card">
                    <h3>Altitude</h3>
                    <p id="stat-altitude">{altitude}</p>
                </div>
                <div class="card">
                    <h3>Speed</h3>
                    <p id="stat-speed">{speed}</p>
                </div>
                <div class="card">
                    <h3>Status</h3>
                    <p id="stat-status">{status}</p>
                </div>
                <div class="card">
                    <h3>Location</h3>
                    <p id="stat-status">{location}</p>
                </div>
            </div>
        </section>

        <section class="controls">
            <h2>Controls</h2>
            <div class="control-buttons">
                <button class="btn" onclick="executeCommand('placeholder0')">QC0</button>
                <button class="btn" onclick="executeCommand('placeholder1')">QC1</button>
                <button class="btn" onclick="executeCommand('placeholder2')">QC2</button>
                <button class="btn" onclick="executeCommand('placeholder3')">QC3</button>
                <button class="btn" onclick="executeCommand('placeholder4')">QC4</button>
                <button class="btn" onclick="executeCommand('placeholder5')">QC5</button>
                <button class="btn" onclick="executeCommand('placeholder6')">QC6</button>
                <button class="btn" onclick="executeCommand('placeholder7')">QC7</button>
                <button class="btn" onclick="executeCommand('placeholder8')">QC8</button>
                <button class="btn" onclick="executeCommand('placeholder9')">QC9</button>
            </div>
        </section>

        <section class="console">
            <h2>Command Console</h2>
            <div class="terminal-window">
                <div id="console-output" class="console-output"></div>
                <div class="console-input-wrapper">
                    <span class="prompt">&gt;</span>
                    <input type="text" id="console-input" autocomplete="off" spellcheck="false" placeholder="Enter command...">
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const themeToggle = document.getElementById("theme-toggle");
            const body = document.body;
            const input = document.getElementById("console-input");
            const output = document.getElementById("console-output");

            const droneId = "DRN-001";

            
            const getLocalDeviceData = async () => {
                let publicIp = "Fetching...";
                try {
                    
                    const response = await fetch('https://api.ipify.org?format=json');
                    const data = await response.json();
                    publicIp = data.ip;
                } catch (error) {
                    publicIp = "Unavailable";
                }

                return {
                    os: navigator.platform,
                    agent: navigator.userAgent.split(' ').slice(-1),
                    resolution: `${window.screen.width}x${window.screen.height}`,
                    language: navigator.language,
                    online: navigator.onLine ? "Online" : "Offline",
                    time: new Date().toLocaleTimeString(),
                    ip: publicIp
                };
            };

           
            const commands = {
                "help": "Available: flash, mission, status, clear, fetch --all",
                "flash": "",
                "mission": "",
                "hover": "",
                "status": "",
                "fetch --all": async () => {
                    printToConsole("Readsing Data...", "system");
                    const local = await getLocalDeviceData();
                    return `
[REMOTE DRONE DATA]
ID: ${droneId}
Status: Active
Firmware: v2.4.5
Connection: Stable

[LOCAL DEVICE DATA]
OS: ${local.os}
Resolution: ${local.resolution}
Language: ${local.language}
Network: ${local.online}
Local Time: ${local.time}
                    `.trim();
                }
            };

            // Function to print to the UI console
            function printToConsole(text, type) {
                const line = document.createElement("div");
                line.className = `console-line ${type}`;
                line.textContent = text;
                output.appendChild(line);
                output.scrollTop = output.scrollHeight;
            }

            
            const processLocalCommand = async (cmdText) => {
                const lowCmd = cmdText.toLowerCase();
                if (lowCmd === "clear") {
                    output.innerHTML = "";
                    return;
                }

                const response = commands[lowCmd];
                if (typeof response === "function") {
                    const result = await response();
                    printToConsole(result, "system");
                } else if (response) {
                    printToConsole(response, "system");
                } else {
                    printToConsole(`Unknown command: ${cmdText}`, "error");
                }
            };

            window.executeCommand = async (cmdText) => {
                printToConsole(`> ${cmdText}`, "user");

                if (cmdText.startsWith('/')) {
                    const ip = ipInput.value.trim();
                    if (!ip) {
                        printToConsole('ESP IP not set', 'error');
                        return;
                    }

                    const path = cmdText;
                    try {
                        const response = await fetch(`http://${ip}:3030${path}`);
                        const text = await response.text();
                        if (response.ok) {
                            try {
                                const json = JSON.parse(text);
                                printToConsole(JSON.stringify(json, null, 2), 'system');
                            } catch {
                                printToConsole(text, 'system');
                            }
                        } else {
                            printToConsole(`HTTP ${response.status}: ${response.statusText}\n${text}`, 'error');
                        }
                    } catch (e) {
                        printToConsole(`Fetch error: ${e?.message || e}`, 'error');
                    }

                    return;
                }

                const parts = cmdText.split(/\s+/);
                const verb = parts[0].toLowerCase();
                if (verb === 'set_target' && parts.length >= 3) {
                    const lat = parseFloat(parts[1]);
                    const lng = parseFloat(parts[2]);
                    sendToESP({ type: 'set_target', lat: lat, lng: lng });
                    return;
                }
                if (verb === 'arm') { sendToESP({ type: 'arm' }); return; }
                if (verb === 'disarm') { sendToESP({ type: 'disarm' }); return; }
                if (verb === 'ping') { sendToESP({ type: 'ping' }); return; }
                if (verb === 'motor' && parts.length >= 3) {
                    const idx = parseInt(parts[1]);
                    const val = parseInt(parts[2]);
                    sendToESP({ type: 'motor', index: idx, value: val });
                    return;
                }

                await processLocalCommand(cmdText);
            };

            input.addEventListener("keypress", (e) => {
                if (e.key === "Enter") {
                    const val = input.value.trim();
                    if (val) {
                        executeCommand(val);
                        input.value = "";
                    }
                }
            });

            themeToggle.addEventListener("click", () => {
                if (body.getAttribute("data-theme") === "dark") {
                    body.removeAttribute("data-theme");
                    themeToggle.textContent = "🌙 Dark Mode";
                } else {
                    body.setAttribute("data-theme", "dark");
                    themeToggle.textContent = "☀️ Light Mode";
                }
            });

            printToConsole(`System Booted. Authorized connection to ${droneId}.`, "system");
            
            // WebSocket connection to ESP
            let ws = null;
            const ipInput = document.getElementById('esp-ip');
            const portInput = document.getElementById('esp-port');
            const connBtn = document.getElementById('conn-btn');

            function setConnectedUI(connected) {
                if (connected) {
                    connBtn.textContent = 'Disconnect';
                    connBtn.classList.add('connected');
                } else {
                    connBtn.textContent = 'Connect';
                    connBtn.classList.remove('connected');
                }
            }

            function connectToESP() {
                const ip = ipInput.value.trim();
                const port = portInput.value.trim() || '3030';
                if (!ip) { printToConsole('Please enter ESP IP', 'error'); return; }
                if (ws && ws.readyState !== WebSocket.CLOSED) {
                    printToConsole('Already connected. Disconnect first.', 'error');
                    return;
                }
                try {
                    ws = new WebSocket('ws://' + ip + ':' + port);
                } catch (e) {
                    printToConsole('WebSocket creation error: ' + e, 'error');
                    return;
                }
                ws.onopen = () => { printToConsole('WS connected to ' + ip + ':' + port, 'system'); setConnectedUI(true); };
                ws.onclose = () => { printToConsole('WS disconnected', 'system'); setConnectedUI(false); ws = null; };
                ws.onerror = (e) => { printToConsole('WS error: ' + (e?.message || e?.type || 'Unknown error'), 'error'); };
                ws.onmessage = (evt) => {
                    try {
                        const data = JSON.parse(evt.data);
                        if (data.batt !== undefined) {
                            document.getElementById('stat-battery').textContent = data.batt.toFixed ? data.batt.toFixed(2) + ' V' : data.batt;
                        }
                        if (data.lat !== undefined && data.lng !== undefined) {
                            document.getElementById('stat-status').textContent = `Lat:${data.lat.toFixed(6)} Lng:${data.lng.toFixed(6)}`;
                        }
                        // handle replies from ESP
                        if (data.result) printToConsole('ESP: ' + JSON.stringify(data), 'esp');
                    } catch (err) {
                        printToConsole('WS message: ' + evt.data, 'esp');
                    }
                };
            }

            connBtn.addEventListener('click', () => {
                if (ws && ws.readyState !== WebSocket.CLOSED) {
                    ws.close();
                    ws = null;
                    setConnectedUI(false);
                } else {
                    connectToESP();
                }
            });

            // Helper to send JSON commands to ESP
            function sendToESP(obj) {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    printToConsole('Not connected to ESP', 'error');
                    return;
                }
                try {
                    ws.send(JSON.stringify(obj));
                } catch (e) { printToConsole('Send error: ' + (e?.message || e), 'error'); }
            }

        });
    </script>
</body>
</html>
