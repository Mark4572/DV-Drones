<!DOCTYPE html>
<html lang="de">
<head>
    <script>
        function checkVariable() {
            fetch('/api/ready')
                .then(response => response.json())
                .then(data => {
                    if (data.ready === true) {
                        window.location.href = "/home";
                    }
                })
                .catch(error => console.error("Fehler beim Abrufen:", error));
        }
        setInterval(checkVariable, 2500);
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DV Client</title>
    <style>
        /* Hintergrund für die gesamte Seite, damit man die Quadrate gut sieht */
        body {
            background-color: #1a1a1a;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container für den Loader */
        .loader {
            position: relative;
            width: 50px;
            height: 50px;
        }

        /* From Uiverse.io by JkHuger */ 
        @keyframes loader_5191 {
          from {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }

        .square {
          background: #ddd;
          width: 10px;
          height: 10px;
          position: absolute;
          top: 50%;
          left: 50%;
          margin-top: -5px;
          margin-left: -5px;
        }

        #sq1 {
          margin-top: -25px;
          margin-left: -25px;
          animation: loader_5191 675ms ease-in-out 0s infinite alternate;
        }

        #sq2 {
          margin-top: -25px;
          animation: loader_5191 675ms ease-in-out 75ms infinite alternate;
        }

        #sq3 {
          margin-top: -25px;
          margin-left: 15px;
          animation: loader_5191 675ms ease-in-out 150ms infinite alternate;
        }

        #sq4 {
          margin-left: -25px;
          animation: loader_5191 675ms ease-in-out 225ms infinite alternate;
        }

        #sq5 {
          animation: loader_5191 675ms ease-in-out 300ms infinite alternate;
        }

        #sq6 {
          margin-left: 15px;
          animation: loader_5191 675ms ease-in-out 375ms infinite alternate;
        }

        #sq7 {
          margin-top: 15px;
          margin-left: -25px;
          animation: loader_5191 675ms ease-in-out 450ms infinite alternate;
        }

        #sq8 {
          margin-top: 15px;
          animation: loader_5191 675ms ease-in-out 525ms infinite alternate;
        }

        #sq9 {
          margin-top: 15px;
          margin-left: 15px;
          animation: loader_5191 675ms ease-in-out 600ms infinite alternate;
        }
    </style>
</head>
<body>

    <div class="loader">
      <div class="square" id="sq1"></div>
      <div class="square" id="sq2"></div>
      <div class="square" id="sq3"></div>
      <div class="square" id="sq4"></div>
      <div class="square" id="sq5"></div>
      <div class="square" id="sq6"></div>
      <div class="square" id="sq7"></div>
      <div class="square" id="sq8"></div>
      <div class="square" id="sq9"></div>
    </div>

</body>
</html>
