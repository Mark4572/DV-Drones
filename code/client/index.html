<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoRisk Launcher - Dashboard</title>
    <style>
        /* Core Reset & Fonts */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Standard Werte */
        :root {
            --bg-dark: #0a090f;
            --accent-purple: #9333ea;
            --accent-glow: #bd5cff;
            --panel-bg: rgba(20, 18, 31, 0.6);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

       
        #fxCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

   
        .main-layout {
            flex: 1;
            display: flex;
            z-index: 10;
            position: relative;
            height: calc(100vh - 40px);
        }

  
        .sidebar {
            width: 240px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--panel-border);
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .logo-area {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 2rem;
            padding-left: 0.5rem;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
            display: block;
        }

        .sidebar-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.05);
            transform: translateX(4px);
        }

        /* Aktiver Button bekommt NoRisk Akzentfarbe */
        .sidebar-btn.active {
            color: white;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-glow));
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

 
        .content {
            flex: 1;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        .content h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

  
        .taskbar {
            height: 40px;
            background: rgba(10, 9, 15, 0.9);
            border-top: 1px solid var(--panel-border);
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .taskbar-right {
            display: flex;
            gap: 1.5rem;
        }

        .version-tag {
            color: var(--accent-glow);
            font-weight: 600;
        }
    </style>
</head>
<body>

 
    <canvas id="fxCanvas"></canvas>

    <div class="main-layout">
        <aside class="sidebar">
            <div class="logo-area">NORISK</div>
            <a href="#" class="sidebar-btn active">Play</a>
            <a href="#" class="sidebar-btn">Mods</a>
            <a href="#" class="sidebar-btn">Cosmetics</a>
            <a href="home.html" class="sidebar-btn">Theme Editor</a> <!-- Link zurück zum Editor -->
        </aside>

        
        <main class="content">
            <h2>DV CLIENT</h2>
            <p style="color: var(--text-muted);">Next Generation of Drones</p>
        </main>
    </div>

    <!-- Untere Taskbar -->
    <footer class="taskbar">
        <div class="taskbar-left"></div>
        <div class="taskbar-right">
            <div>Version: <span id="versionDisplay" class="version-tag">Lädt...</span></div>
            <div id="clockDisplay">00:00:00</div>
        </div>
    </footer>

        <script>
        document.addEventListener('DOMContentLoaded', () => {
            const root = document.documentElement;
            const canvas = document.getElementById('fxCanvas');
            const ctx = canvas.getContext('2d');

            
            const defaults = { bg: '#0a090f', accent: '#9333ea', glow: '#bd5cff', fx: 'none' };
            
            const bg = localStorage.getItem('themeColor1') || defaults.bg;
            const accent = localStorage.getItem('themeColor2') || defaults.accent;
            const glow = localStorage.getItem('themeColor3') || defaults.glow;
            const fx = localStorage.getItem('launcherFX') || defaults.fx;

       
            root.style.setProperty('--bg-dark', bg);
            root.style.setProperty('--accent-purple', accent);
            root.style.setProperty('--accent-glow', glow);

     
            const activeBtn = document.querySelector('.sidebar-btn.active');
            if(activeBtn) activeBtn.style.boxShadow = `0 4px 15px ${accent}44`;

   
            function updateClock() {
                const now = new Date();
                const timeString = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                document.getElementById('clockDisplay').textContent = timeString;
            }
            setInterval(updateClock, 1000);
            updateClock();


            function loadVersion() {
                fetch('latest.json')
                    .then(response => {
                        if (!response.ok) throw new Error('Netzwerk-Fehler beim Laden der JSON');
                        return response.json();
                    })
                    .then(data => {
                        document.getElementById('versionDisplay').textContent = data.version || "Unbekannt";
                    })
                    .catch(error => {
                        console.error('Fehler:', error);
                        document.getElementById('versionDisplay').textContent = "v1.0.0 (Offline)";
                    });
            }
            loadVersion();


            let animationFrameId = null;
            let matrixDrops = [];
            let enchantmentParticles = [];
            let auroraPhase = 0;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function initEffects(effect) {
                if (fx === 'matrix') {
                    const columns = Math.floor(canvas.width / 16) + 1;
                    matrixDrops = Array(columns).fill(1).map(() => Math.random() * -100);
                } else if (fx === 'enchantment') {
                    enchantmentParticles = Array(40).fill(0).map(() => ({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height + canvas.height,
                        speed: 0.5 + Math.random() * 1.2,
                        char: String.fromCharCode(0x2190 + Math.floor(Math.random() * 100)),
                        size: 10 + Math.random() * 10,
                        opacity: Math.random()
                    }));
                }
                if (fx !== 'none') draw();
            }

            function draw() {
                if (fx === 'matrix') {
                    ctx.fillStyle = `rgba(${hexToRgb(bg)}, 0.08)`;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.font = '15px monospace';
                    matrixDrops.forEach((y, i) => {
                        const text = String.fromCharCode(33 + Math.floor(Math.random() * 93));
                        const x = i * 16;
                        ctx.fillStyle = Math.random() > 0.98 ? glow : accent;
                        ctx.fillText(text, x, y);
                        if (y > canvas.height && Math.random() > 0.975) matrixDrops[i] = 0;
                        matrixDrops[i] += 16;
                    });
                } 
                else if (fx === 'enchantment') {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.font = '14px sans-serif';
                    enchantmentParticles.forEach(p => {
                        ctx.fillStyle = `rgba(${hexToRgb(accent)}, ${p.opacity})`;
                        ctx.fillText(p.char, p.x, p.y);
                        p.y -= p.speed;
                        p.opacity -= 0.001;
                        if (p.y < -20 || p.opacity <= 0) {
                            p.y = canvas.height + 20;
                            p.x = Math.random() * canvas.width;
                            p.opacity = Math.random();
                        }
                    });
                } 
                else if (fx === 'aurora') {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    auroraPhase += 0.002;
                    for (let i = 0; i < 2; i++) {
                        const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                        gradient.addColorStop(0, 'transparent');
                        gradient.addColorStop(0.5, `rgba(${hexToRgb(accent)}, ${0.1 - i * 0.03})`);
                        gradient.addColorStop(1, 'transparent');
                        ctx.fillStyle = gradient;
                        ctx.beginPath();
                        ctx.moveTo(0, canvas.height);
                        for (let x = 0; x <= canvas.width; x += 30) {
                            const y = Math.sin(x * 0.002 + auroraPhase + i) * 100 + (canvas.height * 0.5);
                            ctx.lineTo(x, y);
                        }
                        ctx.lineTo(canvas.width, canvas.height);
                        ctx.fill();
                    }
                }
                if (fx !== 'none') animationFrameId = requestAnimationFrame(draw);
            }

            function hexToRgb(hex) {
                const bigint = parseInt(hex.slice(1), 16);
                return `${(bigint >> 16) & 255}, ${(bigint >> 8) & 255}, ${bigint & 255}`;
            }

            initEffects(fx);
        });
    </script>
</body>
</html>
