<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customizable Theme Background</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        
        :root {
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --panel-bg: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --accent-color: #00adb5;
            --border-color: rgba(255, 255, 255, 0.2);
        }

        /* background */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
            color: var(--text-color);
            transition: background 0.8s ease, color 0.5s ease;
            overflow: hidden;
        }

        
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        
        .control-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 10;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        p {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }

        
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .theme-btn {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .theme-btn:hover {
            background: var(--accent-color);
            color: #000;
            transform: translateY(-2px);
        }

        
        .customizer {
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .customizer h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .color-picker-group {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 10px;
        }

        .picker-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            gap: 5px;
            opacity: 0.9;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            background: transparent;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 2px solid #ffffff;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <h1>Theme Engine</h1>
        <p>Choose a preset or engineer your own background gradient</p>

        <!-- Preset Section -->
        <div class="theme-grid">
            <button class="theme-btn" onclick="setPreset('midnight')">Midnight Ocean</button>
            <button class="theme-btn" onclick="setPreset('sunset')">Cyber Sunset</button>
            <button class="theme-btn" onclick="setPreset('forest')">Deep Forest</button>
            <button class="theme-btn" onclick="setPreset('aurora')">Northern Lights</button>
            <button class="theme-btn" onclick="setPreset('dark')">Dark Mode</button>
            <button class="theme-btn" onclick="setPreset('ocean')">Ocean Breeze</button>
            <button class="theme-btn" onclick="setPreset('fire')">Fiery Passion</button>
            <button class="theme-btn" onclick="setPreset('candy')">Candy Floss</button>
            <button class="theme-btn" onclick="setPreset('night')">Night Sky</button>
            <button class="theme-btn" onclick="setPreset('dawn')">Dawn Glow</button>
            <button class="theme-btn" onclick="setPreset('twilight')">Twilight</button>
        </div>

       
        <div class="customizer">
            <h2>Live Customizer</h2>
            <div class="color-picker-group">
                <div class="picker-wrapper">
                    <input type="color" id="color1" value="#0f2027" oninput="updateCustomTheme()">
                    <label for="color1">Color 1</label>
                </div>
                <div class="picker-wrapper">
                    <input type="color" id="color2" value="#203a43" oninput="updateCustomTheme()">
                    <label for="color2">Color 2</label>
                </div>
                <div class="picker-wrapper">
                    <input type="color" id="color3" value="#2c5364" oninput="updateCustomTheme()">
                    <label for="color3">Color 3</label>
                </div>
            </div>
        </div>
    </div>

<script>
    const presets = {
        midnight: { c1: '#0f2027', c2: '#203a43', c3: '#2c5364' },
        sunset: { c1: '#ff5f6d', c2: '#ffc371', c3: '#ff9a9e' },
        forest: { c1: '#134E5E', c2: '#71B280', c3: '#A8E6CF' },
        aurora: { c1: '#00d2ff', c2: '#3a7bd5', c3: '#00c6ff' },
        dark: { c1: '#000000', c2: '#434343', c3: '#666666' },
        ocean: { c1: '#2E8BC0', c2: '#145DA0', c3: '#0C2D48' },
        fire: { c1: '#FF512F', c2: '#DD2476', c3: '#FF512F' },
        candy: { c1: '#ff9a9e', c2: '#fad0c4', c3: '#fbc2eb' },
        night: { c1: '#141E30', c2: '#243B55', c3: '#141E30' },
        dawn: { c1: '#FFDEE9', c2: '#B5FFFC', c3: '#FFDEE9' },
        twilight: { c1: '#0F2027', c2: '#203A43', c3: '#2C5364' },
        auroraBorealis: { c1: '#00c6ff', c2: '#0072ff', c3: '#00c6ff' }
    };
const root = document.documentElement;


function saveThemeToStorage(c1, c2, c3) {
    localStorage.setItem('themeColor1', c1);
    localStorage.setItem('themeColor2', c2);
    localStorage.setItem('themeColor3', c3);
}

5
function setPreset(themeName) {
    const theme = presets[themeName];
    
    root.style.setProperty('--bg-gradient', `linear-gradient(135deg, ${theme.c1}, ${theme.c2}, ${theme.c3})`);
    root.style.setProperty('--accent-color', theme.c2);

    document.getElementById('color1').value = theme.c1;
    document.getElementById('color2').value = theme.c2;
    document.getElementById('color3').value = theme.c3;


    saveThemeToStorage(theme.c1, theme.c2, theme.c3);
}


function updateCustomTheme() {
    const c1 = document.getElementById('color1').value;
    const c2 = document.getElementById('color2').value;
    const c3 = document.getElementById('color3').value;

    root.style.setProperty('--bg-gradient', `linear-gradient(135deg, ${c1}, ${c2}, ${c3})`);
    root.style.setProperty('--accent-color', c2);


    saveThemeToStorage(c1, c2, c3);
}

window.addEventListener('DOMContentLoaded', () => {
    const c1 = localStorage.getItem('themeColor1');
    const c2 = localStorage.getItem('themeColor2');
    const c3 = localStorage.getItem('themeColor3');

    if (c1 && c2 && c3) {
        root.style.setProperty('--bg-gradient', `linear-gradient(135deg, ${c1}, ${c2}, ${c3})`);
        root.style.setProperty('--accent-color', c2);
        if(document.getElementById('color1')) {
            document.getElementById('color1').value = c1;
            document.getElementById('color2').value = c2;
            document.getElementById('color3').value = c3;
        }
    }
});
 </script>
</body>
</html>
